name: release

# One repo, TWO services (documentdb-cluster + documentdb-database), each with
# its worker image and its global package, one chained run: release-please cuts
# the version once, the release-publish-oci chain builds/pushes/registers the
# CLUSTER image and publishes its package, and a second call of the same chain
# does the same for the DATABASE against the same tag — both artifacts end up
# in the release notes, both packages carry the release version.
#
# Chained on purpose: release-please creates tags with GITHUB_TOKEN, and
# GitHub never triggers workflows from bot-token events.
#
# Recovery / backfill: dispatch with existing_tag to publish + finalize a tag
# that already exists.
#
# Configure: secrets AWS_ROLE_ARN_ECR_PUSH + ARTIFACT_NP_API_KEY, variable
# NP_ARTIFACT_NRN; the package state secrets come from the organization.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Publish + finalize an existing tag (recovery/backfill)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC auth against AWS for the ECR pushes

jobs:
  # Cluster image rides the full chain: release-please + build + push +
  # artifact registration + release finalize.
  release:
    uses: nullplatform/actions-nullplatform/.github/workflows/release-publish-oci.yml@v1
    with:
      image_name: agent-plugins/services/document-db-cluster
      dockerfile: Dockerfile.cluster
      # amd64 only, deliberately: the arm64 leg of the multi-arch default has
      # no consumer here and doubles the build.
      platforms: linux/amd64
      existing_tag: ${{ inputs.existing_tag || '' }}
      # Publishes the cluster service as a global package from this release's
      # specs and image (documentdb-cluster/publish). The state role is
      # github-actions-<repository>-package-state, by convention;
      # AWS_ROLE_ARN_PACKAGE_STATE overrides it for a fork and is not set here.
      package_stack_dir: documentdb-cluster/publish
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_state_aws_account_id: ${{ secrets.PACKAGE_STATE_AWS_ACCOUNT_ID }}
      package_state_role_arn: ${{ secrets.AWS_ROLE_ARN_PACKAGE_STATE }}
      package_state_bucket: ${{ secrets.PACKAGE_TFSTATE_BUCKET }}
      package_state_region: ${{ secrets.PACKAGE_TFSTATE_REGION }}

  # Database image and package: the same workflow again, against the tag the
  # first call cut (existing_tag skips release-please and the second call
  # builds, pushes, registers and publishes the database from that tag,
  # appending its own artifact row to the release). Same workflow file at the
  # same ref: a second call at a DIFFERENT ref is what fails at startup.
  release-database:
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.release_created == 'true' || inputs.existing_tag != '') }}
    uses: nullplatform/actions-nullplatform/.github/workflows/release-publish-oci.yml@v1
    with:
      image_name: agent-plugins/services/document-db-database
      dockerfile: Dockerfile.database
      platforms: linux/amd64
      existing_tag: ${{ inputs.existing_tag || needs.release.outputs.tag_name }}
      package_stack_dir: documentdb-database/publish
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_state_aws_account_id: ${{ secrets.PACKAGE_STATE_AWS_ACCOUNT_ID }}
      package_state_role_arn: ${{ secrets.AWS_ROLE_ARN_PACKAGE_STATE }}
      package_state_bucket: ${{ secrets.PACKAGE_TFSTATE_BUCKET }}
      package_state_region: ${{ secrets.PACKAGE_TFSTATE_REGION }}
